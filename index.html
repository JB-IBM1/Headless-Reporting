<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AusNet — Deliverability Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; padding: 0; height: 100%; }
    body { background: #F3F5F9; }

    /* Loading splash — shown until React mounts */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0B1220; z-index: 9999;
      font-family: 'Space Grotesk', sans-serif; color: #fff;
      gap: 18px;
      transition: opacity 0.4s;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash-logo { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
    #splash-status { font-size: 13px; color: #8B93A7; font-family: 'IBM Plex Mono', monospace; }
    .splash-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #16C784;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
  </style>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- React 18 (UMD — sets window.React, window.ReactDOM) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- prop-types — required peer dependency of Recharts (sets window.PropTypes) -->
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

  <!-- Recharts 2 (UMD — sets window.Recharts) -->
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- lucide-react UMD reads window.react (lowercase) for React — alias it before load -->
  <script>window.react = window.React;</script>

  <!-- Lucide React icons (UMD — sets window.LucideReact) -->
  <script crossorigin src="https://unpkg.com/lucide-react@0.447.0/dist/umd/lucide-react.min.js"></script>

  <!-- Babel standalone — transpiles JSX at runtime (prototype use only) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>

  <!-- Loading splash -->
  <div id="splash">
    <div class="splash-dot"></div>
    <div id="splash-logo">AusNet</div>
    <div id="splash-status">loading dashboard…</div>
  </div>

  <!-- React mount point -->
  <div id="root"></div>

  <script>
    // ── Session ID resolution ────────────────────────────────────────────────
    // Priority: 1. ?session= URL param  2. localStorage  3. generated UUID
    (function () {
      const params = new URLSearchParams(window.location.search);
      const fromUrl = params.get("session");
      if (fromUrl) {
        localStorage.setItem("hr_session_id", fromUrl);
        window.__sessionId = fromUrl;
        return;
      }
      const stored = localStorage.getItem("hr_session_id");
      if (stored) { window.__sessionId = stored; return; }

      const fresh = crypto.randomUUID();
      localStorage.setItem("hr_session_id", fresh);
      const url = new URL(window.location.href);
      url.searchParams.set("session", fresh);
      window.history.replaceState({}, "", url.toString());
      window.__sessionId = fresh;
    })();

    // ── Mount helper ─────────────────────────────────────────────────────────
    window.__mountDashboard = function (App) {
      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(
        React.createElement(App, {
          sessionId: window.__sessionId,
          baseUrl:   "",   // same-origin: server.js serves both API and static files
        })
      );
      const splash = document.getElementById("splash");
      if (splash) {
        splash.classList.add("hidden");
        setTimeout(function () { if (splash.parentNode) splash.remove(); }, 500);
      }
    };

    // ── Load and transpile the dashboard JSX ─────────────────────────────────
    // Babel standalone's type="text/babel" src= attribute has cross-browser
    // quirks with file:// and some dev servers, so we fetch + transform manually.
    (async function () {
      const splash = document.getElementById("splash-status");
      try {
        const res = await fetch("Headless_Reporting_Dashboard.jsx?v=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status} loading dashboard JSX`);
        const src = await res.text();

        if (splash) splash.textContent = "compiling…";

        // Transform JSX only — do NOT use the "env" preset because that wraps
        // output in CommonJS (exports/require) which doesn't exist in the browser.
        // We only need JSX→createElement conversion; ES2020+ is fine natively.
        const { code: rawCode } = Babel.transform(src, {
          presets:  ["react"],
          filename: "Headless_Reporting_Dashboard.jsx",
        });

        // Strip any `export default …` / `export { … }` statements — the script
        // sets window.__DashboardApp directly, so module exports are not needed.
        const code = rawCode
          .replace(/^\s*export\s+default\s+/gm, "")
          .replace(/^\s*export\s*\{[^}]*\}\s*;?\s*$/gm, "");

        // Execute in a plain function scope. Pass window explicitly so the
        // script can read/write globals without needing module machinery.
        // eslint-disable-next-line no-new-func
        new Function("window", code)(window);

        // Safety net: if the script ran but __mountDashboard fired before
        // __DashboardApp was set, mount now.
        if (window.__DashboardApp && !document.getElementById("root").hasChildNodes()) {
          window.__mountDashboard(window.__DashboardApp);
        }
      } catch (err) {
        console.error("Dashboard load failed:", err);
        if (splash) splash.textContent = "error — see console";
        // Show a minimal error message in the root div
        const root = document.getElementById("root");
        root.innerHTML = `
          <div style="padding:40px;font-family:monospace;color:#E5484D;background:#fff;min-height:100vh">
            <strong>Dashboard failed to load</strong><br><br>
            ${String(err)}<br><br>
            <small>Check the browser console for details. Make sure the server is running
            (<code>npm start</code>) and SFMC credentials are set in your environment.</small>
          </div>`;
        const s = document.getElementById("splash");
        if (s) s.remove();
      }
    })();
  </script>
</body>
</html>
